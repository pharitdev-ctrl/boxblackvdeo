<style>
.st{position:absolute;inset:0;animation:out .35s 3.0s both}
.ring{position:absolute;left:330px;top:110px;width:420px;height:420px;animation:pop .5s calc(var(--w1) * 1s - .25s) both;transform-origin:50% 50%}
.num{position:absolute;left:390px;top:260px;width:300px;height:120px;display:flex;align-items:center;justify-content:center;font-size:120px;line-height:1;color:var(--ink)}
.arw{position:absolute;left:460px;top:540px;width:160px;height:200px;animation:drop .55s calc(var(--w4) * 1s - .4s) both}
.arw svg{animation:bob .5s calc(var(--w4) * 1s + .15s) both}
@keyframes pop{0%{opacity:0;transform:scale(.4)}70%{opacity:1;transform:scale(1.08)}100%{opacity:1;transform:scale(1)}}
@keyframes drop{0%{opacity:0;transform:translateY(-80px)}55%{opacity:1;transform:translateY(0)}72%{transform:translateY(-26px)}88%{transform:translateY(0)}94%{transform:translateY(-6px)}100%{opacity:1;transform:translateY(0)}}
@keyframes bob{0%{transform:translateY(0)}50%{transform:translateY(-12px)}100%{transform:translateY(0)}}
@keyframes out{0%{opacity:1}100%{opacity:0}}
</style>
<div class="st">
<div class="ring">
<svg width="420" height="420" viewBox="0 0 420 420">
<circle cx="210" cy="210" r="170" fill="none" stroke="var(--ink)" stroke-width="48"/>
<circle cx="210" cy="210" r="170" fill="none" stroke="color-mix(in srgb, var(--paper) 30%, var(--ink))" stroke-width="30"/>
<circle id="prog" cx="210" cy="210" r="170" fill="none" stroke="var(--accent)" stroke-width="30" stroke-linecap="round" pathLength="100" stroke-dasharray="100 100" stroke-dashoffset="100" transform="rotate(-90 210 210)"/>
<circle cx="210" cy="210" r="140" fill="var(--paper)" stroke="var(--ink)" stroke-width="8"/>
</svg>
</div>
<div class="num"><span id="val">0%</span></div>
<div class="arw">
<svg width="160" height="200" viewBox="-10 -10 160 200">
<polygon points="45,0 95,0 95,90 135,90 70,170 5,90 45,90" fill="var(--accent)" stroke="var(--ink)" stroke-width="10" stroke-linejoin="round"/>
</svg>
</div>
</div>
<script>
const prog = document.getElementById("prog");
const val = document.getElementById("val");
window.frame = (t) => {
  const a = T[0], b = T[1];
  let p = (t - a) / Math.max(0.1, b - a);
  p = Math.min(1, Math.max(0, p));
  const e = 1 - Math.pow(1 - p, 3);
  const off = 100 - 90 * e;
  prog.setAttribute("stroke-dashoffset", String(off));
  prog.style.opacity = e > 0.005 ? "1" : "0";
  val.textContent = Math.round(90 * e) + "%";
};
window.frame(0);
</script>
