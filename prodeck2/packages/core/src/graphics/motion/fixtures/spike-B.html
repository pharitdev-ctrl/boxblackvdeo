<style>
.mgB{position:absolute;left:0;top:0;width:1080px;height:900px;overflow:hidden}
.mgB>*{position:absolute;display:block}
.mgB svg{overflow:visible}
.mgB .earth{left:40px;top:700px;width:500px;height:170px}
.mgB .space{left:785px;top:50px;width:230px;height:230px}
.mgB .dot{box-sizing:border-box;width:34px;height:34px;border:6px solid #1F2227;border-radius:50%;background:#fff}
.mgB .rocket{left:290px;top:480px;width:140px;height:250px;transform-origin:70px 125px}

.mgB .astro{left:110px;top:545px;width:150px;height:190px;transform-origin:50% 100%}
.mgB .lab,.mgB .only{white-space:nowrap}
.mgB .lab{left:560px;top:548px;font-size:72px;line-height:1.3;padding:12px 34px 16px;border-radius:28px;background:#1F2227;color:#fff;transform-origin:0 50%}
.mgB .only{left:572px;top:690px;font-size:100px;line-height:1.4;padding:6px 40px 12px;border:8px solid #1F2227;border-radius:30px;background:#FFD447;color:#1F2227}

<div class="mgB">

    <g transform="rotate(-20 135 112)" fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round">
      <ellipse cx="135" cy="112" rx="60" ry="15"/>
      <circle cx="135" cy="112" r="36" fill="#6EC1FF" stroke="none"/>

    <g fill="#FFD447">
      <path transform="translate(58 72)" d="M0 -15Q2 -2 15 0Q2 2 0 15Q-2 2 -15 0Q-2 -2 0 -15Z"/>
      <path transform="translate(176 166) scale(.8)" d="M0 -15Q2 -2 15 0Q2 2 0 15Q-2 2 -15 0Q-2 -2 0 -15Z"/>

      <path d="M19 0 Q15 34 30 56 Q45 34 41 0 Z" fill="#FFD447"/>
    </svg>
    <svg width="140" height="250" viewBox="0 0 140 250">
      <g stroke="#1F2227" stroke-width="8" stroke-linejoin="round">
        <path d="M32 150 L8 212 Q6 230 26 224 L46 212 Z M108 150 L132 212 Q134 230 114 224 L94 212 Z" fill="#6EC1FF"/>
        <rect x="48" y="216" width="44" height="24" rx="7" fill="#1F2227"/>
        <path d="M70 6 C112 50 116 122 108 222 L32 222 C24 122 28 50 70 6 Z" fill="#fff"/>
        <path d="M70 6 C86 22.7 96.4 43.5 102.8 68.3 L37.2 68.3 C43.6 43.5 54 22.7 70 6 Z" fill="#FFD447"/>

  <svg class="astro" viewBox="0 0 150 190">

      <rect x="28" y="84" width="94" height="64" rx="16" fill="#6EC1FF"/>
      <rect x="46" y="136" width="25" height="48" rx="11" fill="#fff"/>

      <path d="M44 104 L24 132 M106 104 L130 78" stroke="#fff" stroke-width="14" fill="none"/>

    </g>
  </svg>

</div>
<script>
(() => {
  const D = 3.4, root = document.querySelector('.mgB'), $ = (s) => root.querySelector(s);
  const K = (t, o, tr, e) => [t, { opacity: o, transform: tr }, e];
  const T = (x, y, r = 0, sx = 1, sy = sx) => `translate(${x}px,${y}px) rotate(${r}deg) scale(${sx},${sy})`;
  const A = (el, k) => {
    if (k[0][0] > 0) k.unshift([0, k[0][1]]);
    if (k[k.length - 1][0] < D) k.push([D, k[k.length - 1][1]]);
    el.animate(k.map(([t, f, e]) => ({ offset: t / D, easing: e || 'ease-out', ...f })), { duration: D * 1000, fill: 'both' });
  };
  // whole graphic is gone before D
  A(root, [K(3.08, 1, 'none'), K(3.36, 0, 'none')]);
  // 0.15 "เขาต้อง": the astronaut on the ground
  A($('.earth'), [K(0, 0, T(0, 70)), K(.15, 1, T(0, 0)), K(3.05, 1, T(0, 0), 'ease-in'), K(3.32, 0, T(0, 50))]);
  A($('.astro'), [K(0, 0, T(0, 0, 0, .2)), K(.15, 1, T(0, 0, 0, 1.14)), K(.28, 1, T(0, 0)),
    K(.42, 1, T(0, 0, 0, 1.05, .93)), K(.55, 1, T(0, -34, 0, .97, 1.05), 'ease-in'), K(.68, 1, T(0, 0)),
    K(1.2, 1, T(0, 0), 'ease-in-out'), K(1.31, 1, T(80, -185, 18, .62)), K(1.4, 1, T(175, -110, 0, .3), 'linear'),
    K(1.42, 0, T(175, -110, 0, .3))]);
  // 0.55 "ไปด้วยกับ": the route and the destination
  [.25, .42, .59, .76, .93, 1.1].forEach((u, i) => {
    const d = document.createElement('i'), a = .26 + i * .04, z = 1.49 + .17 * u;
    d.className = 'dot'; d.style.left = 393 + 312 * u + 'px'; d.style.top = 493 - 255 * u + 'px';
    root.insertBefore(d, $('.rocket'));
    A(d, [K(a, 0, T(0, 0, 0, 0)), K(a + .08, 1, T(0, 0, 0, 1.3)), K(a + .16, 1, T(0, 0)), K(z, 1, T(0, 0), 'linear'), K(z + .03, 0, T(0, 0, 0, .4))]);
  });
  A($('.space'), [K(.4, 0, T(0, 0, 0, 0)), K(.55, 1, T(0, 0, 0, 1.12)), K(.68, 1, T(0, 0)), K(1.7, 1, T(0, 0)),
    K(1.76, 1, T(0, 0, 0, 1.08)), K(1.88, 1, T(0, 0)), K(3.08, 1, T(0, 0), 'ease-in'), K(3.34, 0, T(0, 0, 0, .7))]);
  // 1.10 "ยานอวกาศ": the rocket lands, he boards, it flies the route
  A($('.rocket'), [K(.9, 0, T(0, -260), 'linear'), K(.95, 1, T(0, -240), 'cubic-bezier(.4,0,1,.7)'), K(1.1, 1, T(0, 0)),
    K(1.16, 1, T(0, 9, 0, 1.07, .93)), K(1.26, 1, T(0, 0)), K(1.4, 1, T(0, 0)), K(1.47, 1, T(0, 8, 0, 1.06, .93), 'ease-in'),
    K(1.55, 1, T(50, -95, 40, .97, 1.05), 'linear'), K(1.72, 1, T(368, -355, 48)), K(1.8, 1, T(362, -350, 48), 'ease-in-out'),
    K(2.4, 1, T(368, -358, 46), 'ease-in-out'), K(3.05, 1, T(362, -350, 48), 'ease-in'), K(3.3, 0, T(440, -420, 48, .6))]);
  A($('.face'), [K(1.38, 0, 'none'), K(1.42, 1, 'none')]);
  const fl = [K(1.42, 0, 'scale(1,0)'), K(1.48, 1, 'scale(1,1.2)')];
  for (let i = 0; i < 19; i++) fl.push(K(1.56 + i * .08, 1, `scale(1,${i % 2 ? 1.05 : .75})`, 'ease-in-out'));
  A($('.flame'), fl);
  A($('.lab'), [K(.98, 0, T(0, 0, 0, .5)), K(1.1, 1, T(0, 0, 0, 1.1)), K(1.2, 1, T(0, 0)), K(1.8, 1, T(0, 0)),
    K(1.85, 1, T(0, -8)), K(1.95, 1, T(0, 0)), K(3.05, 1, T(0, 0), 'ease-in'), K(3.28, 0, T(0, 30))]);
  // 1.80 "เท่านั้น": the stamp slams under the label
  A($('.only'), [K(1.66, 0, T(0, 0, -10, 1.5), 'cubic-bezier(.6,0,1,.7)'), K(1.8, 1, T(0, 0, -4, 1)), K(1.86, 1, T(0, 0, -4, .93)),
    K(1.96, 1, T(0, 0, -4, 1)), K(3.05, 1, T(0, 0, -4, 1), 'ease-in'), K(3.28, 0, T(0, 30, -4, 1))]);
})();
</script>
