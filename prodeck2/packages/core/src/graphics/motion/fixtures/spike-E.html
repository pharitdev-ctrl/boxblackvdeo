<style>
.mg{position:absolute;inset:0;overflow:hidden;animation:out .3s linear 2.7s both}
.mg svg{position:absolute;inset:0}
.q{position:absolute;top:60px;left:50%;transform:translateX(-50%);background:#1F2227;color:#FFF;font-size:62px;line-height:1;padding:26px 44px 30px;border-radius:30px;white-space:nowrap;box-shadow:0 10px 24px rgba(0,0,0,.3);animation:pop .3s cubic-bezier(.3,1.6,.5,1) -.1s both}
.q span{display:inline-block;color:#FFD447;animation:pop .3s cubic-bezier(.3,1.6,.5,1) .4s both}
.chip{position:absolute;left:610px;top:430px;background:#6EC1FF;color:#1F2227;font-size:48px;line-height:1;padding:16px 30px 20px;border-radius:24px;animation:slide .3s cubic-bezier(.3,1.4,.5,1) 1s both}
.stamp{position:absolute;left:590px;top:515px;background:#FF7A59;color:#FFF;font-size:96px;line-height:1;padding:22px 48px 30px;border-radius:30px;border:8px solid #1F2227;transform:rotate(-6deg);animation:stamp .3s cubic-bezier(.2,.8,.3,1.2) 1.65s both}
.drawm{stroke-dasharray:1 1;stroke-dashoffset:1;animation:draw .5s ease-out .2s both}
.red{opacity:0;animation:fadein .15s linear 1.8s both}
.xl{stroke-dasharray:1 1;stroke-dashoffset:1}
.x1{animation:draw .12s ease-out 1.75s both}
.x2{animation:draw .12s ease-out 1.83s both}
.astro{transform-box:fill-box;transform-origin:50% 100%;animation:jump 1.4s linear .1s both}
.moon{transform-box:fill-box;transform-origin:50% 50%;animation:pop .35s cubic-bezier(.3,1.6,.5,1) .15s both}
.earth{animation:fadein .2s linear 0s both}
@keyframes out{to{opacity:0}}
@keyframes fadein{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:translateX(var(--tx,0)) scale(.5)}to{opacity:1;transform:translateX(var(--tx,0)) scale(1)}}
@keyframes slide{from{opacity:0;transform:translateY(30px) scale(.8)}to{opacity:1;transform:none}}
@keyframes stamp{0%{opacity:0;transform:rotate(-6deg) scale(2.2)}70%{opacity:1;transform:rotate(-6deg) scale(.92)}100%{opacity:1;transform:rotate(-6deg) scale(1)}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes jump{
0%{transform:translateY(0) scale(1,1)}
14%{transform:translateY(0) scale(1.12,.8);animation-timing-function:cubic-bezier(.2,.7,.4,1)}
43%{transform:translateY(-210px) translateX(0) scale(.95,1.08) rotate(-8deg);animation-timing-function:cubic-bezier(.6,0,.9,.5)}
78%{transform:translateY(0) scale(1.18,.72) rotate(0)}
88%{transform:translateY(0) scale(.96,1.05)}
94%{transform:translateY(0) scale(1,1) rotate(0)}
97%{transform:translateY(0) rotate(4deg)}
100%{transform:translateY(0) rotate(0)}}
.q{--tx:-50%}
.q span{--tx:0}
</style>
