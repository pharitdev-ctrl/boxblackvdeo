<style>
.st{position:absolute;left:0;top:0;width:1080px;height:800px;overflow:hidden;animation:out .35s 3s both}
@keyframes out{to{opacity:0}}
.gr{position:absolute;left:120px;top:590px;width:840px;height:16px;border-radius:8px;background:var(--ink);animation:pop .35s 0s both}
.ast{position:absolute;left:190px;top:440px;width:120px;height:160px;animation:walk .6s calc(var(--w1) * 1s - .1s) both}
.ast svg{width:100%;height:100%;animation:inside .3s calc(var(--w2) * 1s + .05s) both;transform-origin:50% 70%}
@keyframes walk{0%{transform:translate(0,0)}25%{transform:translate(70px,-14px)}50%{transform:translate(140px,0)}75%{transform:translate(210px,-14px)}100%{transform:translate(260px,0)}}
@keyframes inside{0%{transform:scale(1);opacity:1}100%{transform:scale(.1) translate(250px,-40px);opacity:0}}
.rk{position:absolute;left:450px;top:250px;width:180px;height:340px;animation:launch .7s calc(var(--w3) * 1s - .4s) both;transform-origin:50% 100%}
@keyframes launch{0%{transform:translate(0,0)}10%{transform:translate(-6px,0)}20%{transform:translate(6px,0)}30%{transform:translate(-6px,0)}40%{transform:translate(0,0) scale(1)}100%{transform:translate(0,-250px) scale(.62)}}
.rk svg{width:100%;height:100%;overflow:visible}
.fl{transform-origin:90px 300px;animation:flame 1.6s calc(var(--w3) * 1s - .35s) both}
@keyframes flame{0%{transform:scaleY(0)}10%{transform:scaleY(1.1)}20%{transform:scaleY(.8)}30%{transform:scaleY(1.2)}40%{transform:scaleY(.85)}50%{transform:scaleY(1.15)}60%{transform:scaleY(.8)}70%{transform:scaleY(1.2)}80%{transform:scaleY(.9)}90%{transform:scaleY(1.1)}100%{transform:scaleY(1)}}
.sm{position:absolute;width:110px;height:110px;border-radius:50%;background:var(--paper);border:7px solid var(--ink);top:520px;animation:puff .8s calc(var(--w3) * 1s - .2s) both}
@keyframes puff{0%{transform:scale(0);opacity:1}60%{transform:scale(1.1);opacity:1}100%{transform:scale(1.3);opacity:0}}
.s1{left:390px}.s2{left:580px;animation-delay:calc(var(--w3) * 1s - .12s)}.s3{left:485px;top:545px;animation-delay:calc(var(--w3) * 1s - .05s)}
.star{position:absolute;width:56px;height:56px;animation:pop .35s calc(var(--w3) * 1s) both}
.star svg{width:100%;height:100%}
.t1{left:180px;top:90px}.t2{left:800px;top:60px;animation-delay:calc(var(--w3) * 1s + .1s)}.t3{left:880px;top:250px;animation-delay:calc(var(--w3) * 1s + .2s)}.t4{left:260px;top:280px;animation-delay:calc(var(--w3) * 1s + .15s)}
@keyframes pop{0%{transform:scale(0);opacity:0}70%{transform:scale(1.15);opacity:1}100%{transform:scale(1);opacity:1}}
.lb{position:absolute;left:70px;top:400px;padding:10px 30px;border-radius:22px;background:var(--bar);color:var(--text);font-size:60px;line-height:1.3;border:6px solid var(--ink);animation:pop .4s calc(var(--w3) * 1s - .3s) both}
.stamp{position:absolute;left:560px;top:520px;animation:stamp .35s calc(var(--w4) * 1s - .25s) both}
.stamp div{transform:rotate(-10deg);padding:12px 40px;border:10px solid var(--ink);outline:6px solid var(--accent);outline-offset:-22px;border-radius:26px;background:var(--paper);color:var(--accent);font-size:104px;line-height:1.25;-webkit-text-stroke:8px var(--ink);paint-order:stroke fill}
@keyframes stamp{0%{transform:scale(2.4);opacity:0}70%{transform:scale(.92);opacity:1}100%{transform:scale(1);opacity:1}}
</style>

<rect x="72" y="200" width="36" height="60" rx="12" fill="var(--bar)" stroke="var(--ink)" stroke-width="7"/>
</svg></div>
