<style>
.root{position:absolute;left:0;top:0;width:996px;height:366px;animation:out .34s 2.4s both}
@keyframes out{to{opacity:0}}
.root svg{position:absolute;left:0;top:0}
.earth{animation:rise .5s cubic-bezier(.2,.9,.3,1) calc(var(--w1)*1s) both}
@keyframes rise{from{transform:translateY(140px)}to{transform:translateY(0)}}
.pop{transform-box:fill-box;transform-origin:center;animation:pop .45s cubic-bezier(.3,1.6,.5,1) both}
@keyframes pop{0%{transform:scale(0);opacity:0}30%{opacity:1}100%{transform:scale(1);opacity:1}}
.man{transform-box:fill-box;transform-origin:50% 100%;animation-delay:calc(var(--w1)*1s + .15s)}
.planet{animation-delay:calc(var(--w2)*1s - .3s)}
.star{transform-box:fill-box;transform-origin:center;animation:tw 1.4s ease-in-out both}
@keyframes tw{0%{transform:scale(0) rotate(0deg)}25%{transform:scale(1.2) rotate(20deg)}50%{transform:scale(.7) rotate(35deg)}75%{transform:scale(1.1) rotate(50deg)}100%{transform:scale(.9) rotate(60deg)}}
.s1{animation-delay:calc(var(--w2)*1s - .1s)}
.s2{animation-delay:calc(var(--w2)*1s + .05s)}
.s3{animation-delay:calc(var(--w2)*1s + .2s)}
.s4{animation-delay:calc(var(--w2)*1s + .35s)}
.s5{animation-delay:calc(var(--w2)*1s + .5s)}
.draw{fill:none;stroke:var(--paper);stroke-width:18;stroke-linecap:round;stroke-dasharray:100 100;animation:draw .75s cubic-bezier(.3,.6,.4,1) calc(var(--w3)*1s - .1s) both}
@keyframes draw{from{stroke-dashoffset:100}to{stroke-dashoffset:50}}
.q{animation-delay:calc(var(--w9)*1s - .3s)}
.qt{font-size:120px;fill:var(--accent);stroke:var(--ink);stroke-width:12px;stroke-linejoin:round;paint-order:stroke fill}
</style>
<div class="root">
<svg width="996" height="366" viewBox="0 0 996 366">
<defs>
<path id="trail" d="M200 215 Q 470 30 830 125"/>
<path id="st" d="M0 -16 L4.5 -4.5 16 0 4.5 4.5 0 16 -4.5 4.5 -16 0 -4.5 -4.5Z"/>
<mask id="reveal" maskUnits="userSpaceOnUse" x="0" y="0" width="996" height="366">
<path class="draw" pathLength="100" d="M200 215 Q 470 30 830 125"/>
</mask>
</defs>
<g class="earth">
<circle cx="120" cy="700" r="440" fill="var(--alt)" stroke="var(--ink)" stroke-width="7"/>
<path d="M-10 300 Q 60 280 110 300 T 230 296" fill="none" stroke="var(--ink)" stroke-width="5" stroke-linecap="round" opacity=".5"/>
</g>
<g transform="translate(185 263)">
<g class="pop man">
<rect x="-14" y="-24" width="10" height="26" rx="4" fill="var(--paper)" stroke="var(--ink)" stroke-width="4"/>
<rect x="4" y="-24" width="10" height="26" rx="4" fill="var(--paper)" stroke="var(--ink)" stroke-width="4"/>
<path d="M-14 -40 L-26 -62" stroke="var(--ink)" stroke-width="12" stroke-linecap="round"/>
<path d="M-14 -40 L-26 -62" stroke="var(--paper)" stroke-width="5" stroke-linecap="round"/>
<path d="M14 -40 L28 -60" stroke="var(--ink)" stroke-width="12" stroke-linecap="round"/>
<path d="M14 -40 L28 -60" stroke="var(--paper)" stroke-width="5" stroke-linecap="round"/>
<rect x="-17" y="-50" width="34" height="32" rx="10" fill="var(--accent)" stroke="var(--ink)" stroke-width="4"/>
<circle cx="0" cy="-64" r="14" fill="var(--paper)" stroke="var(--ink)" stroke-width="4"/>
</g>
</g>
<g mask="url(#reveal)">
<use href="#trail" fill="none" stroke="var(--ink)" stroke-width="14" stroke-linecap="round" stroke-dasharray="1 24"/>
<use href="#trail" fill="none" stroke="var(--paper)" stroke-width="7" stroke-linecap="round" stroke-dasharray="1 24"/>
</g>
<g transform="translate(840 125)">
<g class="pop planet">
<ellipse cx="0" cy="0" rx="72" ry="20" fill="none" stroke="var(--ink)" stroke-width="13" transform="rotate(-18)"/>
<circle cx="0" cy="0" r="40" fill="var(--accent)" stroke="var(--ink)" stroke-width="6"/>
<path d="M-68 22 Q 0 -2 68 -22" fill="none" stroke="var(--ink)" stroke-width="13" stroke-linecap="round"/>
<path d="M-68 22 Q 0 -2 68 -22" fill="none" stroke="var(--paper)" stroke-width="5" stroke-linecap="round"/>
<circle cx="-12" cy="-14" r="7" fill="var(--paper)" opacity=".8"/>
</g>
</g>
<g transform="translate(700 58)"><use class="star s1" href="#st" fill="var(--paper)" stroke="var(--ink)" stroke-width="3"/></g>
<g transform="translate(936 56)"><use class="star s2" href="#st" fill="var(--paper)" stroke="var(--ink)" stroke-width="3"/></g>
<g transform="translate(655 170)"><use class="star s3" href="#st" fill="var(--paper)" stroke="var(--ink)" stroke-width="3"/></g>
<g transform="translate(930 215)"><use class="star s4" href="#st" fill="var(--paper)" stroke="var(--ink)" stroke-width="3"/></g>
<g transform="translate(770 225)"><use class="star s5" href="#st" fill="var(--paper)" stroke="var(--ink)" stroke-width="3"/></g>
<g id="qpos" transform="translate(490 110)">
<g class="pop q">
<text class="qt" x="0" y="0" text-anchor="middle" dominant-baseline="central">?</text>
</g>
</g>
</svg>
</div>
<script>
const tr = document.getElementById("trail");
const len = tr.getTotalLength();
const mid = tr.getPointAtLength(len * 0.5);
const qy = Math.max(92, mid.y - 6);
document.getElementById("qpos").setAttribute("transform", "translate(" + mid.x.toFixed(1) + " " + qy.toFixed(1) + ")");
</script>
