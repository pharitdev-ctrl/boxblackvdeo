<style>
.sv{position:absolute;left:0;top:0;width:972px;height:328px;overflow:hidden}
.grp{transform-origin:486px 164px;animation:gin .35s 0s both,gout .3s 3.08s both}
.n{transform-box:fill-box;transform-origin:center;opacity:0;fill:var(--text);font-size:190px}
.n3{animation:pop .4s calc(var(--w2)*1s - .3s) both,out .2s calc(var(--w3)*1s - .32s) both}
.n2{animation:pop .4s calc(var(--w3)*1s - .3s) both,out .2s calc(var(--w4)*1s - .32s) both}
.n1{animation:pop .4s calc(var(--w4)*1s - .3s) both,burst .22s calc(var(--w4)*1s + .1s) both}
.r{transform-box:fill-box;transform-origin:center;opacity:0;fill:none;stroke:var(--accent);stroke-width:10}
.r3{animation:ring .85s calc(var(--w2)*1s - .15s) both}
.r2{animation:ring .85s calc(var(--w3)*1s - .15s) both}
.r1{animation:ring .45s calc(var(--w4)*1s - .15s) both}
.pf{transform-box:fill-box;transform-origin:center;opacity:0;fill:var(--paper);stroke:var(--ink);stroke-width:6;animation:puff .6s calc(var(--w4)*1s + .06s) both}
.rk{opacity:0;animation:fly .6s calc(var(--w4)*1s + .12s) both}
.fl{transform-box:fill-box;transform-origin:50% 0;animation:flick .6s calc(var(--w4)*1s + .12s) both}
@keyframes gin{from{transform:scale(0)}70%{transform:scale(1.08)}to{transform:scale(1)}}
@keyframes gout{to{opacity:0;transform:scale(.7)}}
@keyframes pop{from{opacity:0;transform:scale(.3) translateY(30px)}70%{opacity:1;transform:scale(1.15)}to{opacity:1;transform:scale(1)}}
@keyframes out{to{opacity:0;transform:scale(.5)}}
@keyframes burst{to{opacity:0;transform:scale(1.7)}}
@keyframes ring{from{opacity:0;transform:scale(1.35)}20%{opacity:1}to{opacity:0;transform:scale(.82)}}
@keyframes puff{from{opacity:0;transform:scale(.2)}30%{opacity:1;transform:scale(1)}to{opacity:0;transform:scale(1.5)}}
@keyframes fly{from{opacity:0;transform:translateY(20px)}12%{opacity:1;transform:translateY(0)}to{opacity:1;transform:translateY(-360px)}}
@keyframes flick{from{transform:scaleY(.3)}30%{transform:scaleY(1.3)}60%{transform:scaleY(.9)}to{transform:scaleY(1.4)}}
</style>
<div class="sv">
<svg width="972" height="328" viewBox="0 0 972 328">
<g class="grp">
<circle cx="486" cy="164" r="112" fill="var(--bar)" stroke="var(--ink)" stroke-width="8"/>
<circle class="r r3" cx="486" cy="164" r="140"/>
<circle class="r r2" cx="486" cy="164" r="140"/>
<circle class="r r1" cx="486" cy="164" r="140"/>
<text class="n n3" x="486" y="164" text-anchor="middle" dominant-baseline="central">3</text>
<text class="n n2" x="486" y="164" text-anchor="middle" dominant-baseline="central">2</text>
<text class="n n1" x="486" y="164" text-anchor="middle" dominant-baseline="central">1</text>
</g>
<g transform="translate(440 130)"><circle class="pf" r="34"/></g>
<g transform="translate(530 120)"><circle class="pf" r="30"/></g>
<g transform="translate(420 195)"><circle class="pf" r="28"/></g>
<g transform="translate(548 200)"><circle class="pf" r="36"/></g>
<g transform="translate(486 160)"><circle class="pf" r="40"/></g>
<g transform="translate(486 250)">
<g class="rk">
<path class="fl" d="M-11 24 Q0 66 11 24Z" fill="var(--accent)" stroke="var(--ink)" stroke-width="4"/>
<path d="M-16 4 L-32 32 L-14 25Z" fill="var(--alt)" stroke="var(--ink)" stroke-width="5" stroke-linejoin="round"/>
<path d="M16 4 L32 32 L14 25Z" fill="var(--alt)" stroke="var(--ink)" stroke-width="5" stroke-linejoin="round"/>
<path d="M0 -46 C18 -28 21 0 16 26 L-16 26 C-21 0 -18 -28 0 -46Z" fill="var(--paper)" stroke="var(--ink)" stroke-width="6" stroke-linejoin="round"/>
<circle cx="0" cy="-8" r="7" fill="var(--accent)" stroke="var(--ink)" stroke-width="4"/>
</g>
</g>
</svg>
</div>
