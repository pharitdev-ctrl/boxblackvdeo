<script>
const astro = document.getElementById("astro");
const bob = document.getElementById("bob");
const shake = document.getElementById("shake");
const walkEnd = T[4] * 1000;
const land = T[5] * 1000;
const start = Math.max(0, T[0] * 1000);
const total = land - start;
const f = Math.min(0.85, Math.max(0.3, (walkEnd - start) / total));
astro.animate([
  { transform: "translate(-40px, 266px) scale(1)", offset: 0 },
  { transform: "translate(380px, 266px) scale(1)", offset: f },
  { transform: "translate(450px, 150px) scale(.75)", offset: f + (1 - f) * 0.55 },
  { transform: "translate(498px, 145px) scale(.55)", offset: 1 }
], { duration: total, delay: start, fill: "both", easing: "linear" });
const bk = [];
const steps = 8;
for (let i = 0; i <= steps; i++) {
  bk.push({ transform: "translateY(" + (i % 2 ? -7 : 0) + "px) rotate(" + (i % 2 ? 4 : -4) + "deg)", offset: (i / steps) * f });
}
bk.push({ transform: "translateY(0px) rotate(0deg)", offset: 1 });
bob.animate(bk, { duration: total, delay: start, fill: "both", easing: "linear" });
const sk = [];
for (let i = 0; i <= 10; i++) {
  const a = i === 0 || i === 10 ? 0 : (i % 2 ? 3 : -3) * (1 - i / 12);
  sk.push({ transform: "translate(" + a + "px, " + (i % 2 ? 1 : 0) + "px)" });
}
shake.animate(sk, { duration: 550, delay: T[6] * 1000 - 150, fill: "both", easing: "linear" });
</script>
