<style>
#g{position:absolute;left:0;top:0;width:1080px;height:800px;animation:out .35s 3.6s both}
#g div{position:absolute}
.ground{left:170px;top:676px;width:740px;height:10px;background:var(--ink);border-radius:5px;transform-origin:center;animation:wide .4s calc(var(--w1)*1s - .3s) cubic-bezier(.2,.8,.3,1) both}
.bar{border:6px solid var(--ink);border-bottom:none;border-radius:16px 16px 0 0;transform-origin:bottom center;box-sizing:border-box}
#bp{left:250px;top:616px;width:160px;height:62px;background:var(--accent);animation:grow .55s calc(var(--w3)*1s - .55s) cubic-bezier(.2,.9,.3,1.3) both}
#bs{left:640px;top:150px;width:180px;height:528px;background:var(--alt);animation:grow .6s calc(var(--w6)*1s - .6s) cubic-bezier(.3,1.25,.5,1) both;background-image:repeating-linear-gradient(0deg,transparent 0 60px,color-mix(in srgb,var(--ink) 30%,transparent) 60px 66px)}
#ip{left:280px;top:548px;width:100px;height:64px;animation:riseP .55s calc(var(--w3)*1s - .55s) cubic-bezier(.2,.9,.3,1.3) both}
#is{left:650px;top:62px;width:160px;height:84px;animation:riseS .6s calc(var(--w6)*1s - .6s) cubic-bezier(.3,1.25,.5,1) both}
.plate{background:var(--bar);color:var(--text);font-size:54px;line-height:1;padding:12px 24px 16px;border:6px solid var(--ink);border-radius:20px;white-space:nowrap}
#lp{left:228px;top:440px;animation:pop .35s calc(var(--w3)*1s - .2s) both}
#ls{left:356px;top:150px;animation:pop .35s calc(var(--w6)*1s - .2s) both}
.name{top:694px;font-size:46px;line-height:1;color:var(--paper);-webkit-text-stroke:10px var(--ink);paint-order:stroke fill;white-space:nowrap;transform:translateX(-50%)}
#np{left:330px;animation:fade .3s calc(var(--w1)*1s - .2s) both}
#ns{left:730px;animation:fade .3s calc(var(--w4)*1s - .2s) both}
@keyframes wide{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes riseP{0%{transform:translateY(64px);opacity:0}25%{opacity:1}100%{transform:translateY(0);opacity:1}}
@keyframes riseS{0%{transform:translateY(530px);opacity:0}15%{opacity:1}100%{transform:translateY(0);opacity:1}}
@keyframes pop{0%{transform:scale(0);opacity:0}70%{transform:scale(1.12);opacity:1}100%{transform:scale(1);opacity:1}}
@keyframes fade{from{opacity:0;margin-top:20px}to{opacity:1;margin-top:0}}
@keyframes out{from{opacity:1}to{opacity:0}}
</style>
<div id="g">
<div id="bs" class="bar"></div>
<div id="bp" class="bar"></div>
<div class="ground"></div>
<div id="ip"><svg width="100" height="64" viewBox="0 0 100 64"><path d="M8 34 L20 34 L12 14 L24 14 L40 30 L84 30 Q96 32 84 40 L40 40 L24 58 L12 58 L20 40 L8 40 Z" fill="var(--paper)" stroke="var(--ink)" stroke-width="5" stroke-linejoin="round"/></svg></div>

<div id="lp" class="plate">10 กม.</div>
<div id="ls" class="plate">400 กม.</div>
<div id="np" class="name">เครื่องบิน</div>

</div>
