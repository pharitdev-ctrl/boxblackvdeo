<style>
.mgA{position:absolute;left:0;top:0;width:1080px;height:900px;overflow:hidden;color:#1F2227;animation:mgA-out .3s cubic-bezier(.5,0,.9,.5) 2.85s both}
.mgA>div,.mgA>svg{position:absolute}
.mgA svg{display:block;width:100%;height:100%;overflow:visible}
.mgA .ea{left:60px;top:545px;width:310px;height:310px;animation:mgA-pop .18s cubic-bezier(.3,1.4,.5,1) 0s both}
.mgA .as{left:135px;top:346px;width:180px;height:222px;animation:mgA-drop .18s cubic-bezier(.2,.8,.3,1) .02s both}
.mgA .hop{transform-origin:45% 96%;animation:mgA-hop .46s linear .72s both}
.mgA .tag{left:340px;top:440px;padding:8px 30px;border:8px solid #1F2227;border-radius:30px;background:#FFFFFF;font-size:58px;line-height:1.35;white-space:nowrap;transform-origin:0 50%;animation:mgA-tag 1.65s linear 0s both}
.mgA .tr{left:0;top:0;width:1080px;height:900px}
.mgA .b,.mgA .d{transform-box:fill-box;transform-origin:center}
.mgA .d{animation:mgA-pop .12s cubic-bezier(.3,1.5,.5,1) calc(.88s + var(--i)*.055s) both}
.mgA .b{animation:mgA-beat .3s ease-in-out calc(2.2s + var(--i)*.05s) both}
.mgA .sp{left:695px;top:55px;width:310px;height:310px;animation:mgA-pop .22s cubic-bezier(.3,1.5,.5,1) 1.13s both}
.mgA .orb{transform-origin:0px 0px;animation:mgA-spin 1.55s linear 1.3s both}
.mgA .q{right:60px;top:500px;padding:8px 46px;border:10px solid #1F2227;border-radius:38px;background:#FFD447;box-shadow:0 12px 0 #1F2227;font-size:132px;line-height:1.3;white-space:nowrap;animation:mgA-slam .34s linear 1.68s both}
@keyframes mgA-pop{from{opacity:0;transform:scale(.35)}to{opacity:1;transform:scale(1)}}
@keyframes mgA-drop{from{opacity:0;transform:translateY(-80px)}to{opacity:1;transform:translateY(0)}}
@keyframes mgA-hop{
0%{transform:translateY(0) scale(1,1);animation-timing-function:ease-out}
17%{transform:translateY(0) scale(1.1,.84);animation-timing-function:cubic-bezier(.2,.7,.4,1)}
50%{transform:translateY(-84px) scale(.94,1.08);animation-timing-function:cubic-bezier(.6,0,.8,.4)}
83%{transform:translateY(0) scale(1.1,.86);animation-timing-function:ease-out}
100%{transform:translateY(0) scale(1,1)}}
@keyframes mgA-tag{
0%{opacity:0;transform:scale(.4);animation-timing-function:cubic-bezier(.3,1.5,.5,1)}
12.1%{opacity:1;transform:scale(1)}
88%{opacity:1;transform:scale(1);animation-timing-function:ease-in}
100%{opacity:0;transform:scale(.7)}}
@keyframes mgA-slam{
0%{opacity:0;transform:rotate(-16deg) scale(.3);animation-timing-function:cubic-bezier(.2,.8,.3,1)}
65%{opacity:1;transform:rotate(-5deg) scale(1.1);animation-timing-function:ease-out}
100%{opacity:1;transform:rotate(-5deg) scale(1)}}
@keyframes mgA-beat{0%,100%{transform:scale(1)}45%{transform:scale(1.6)}}
@keyframes mgA-spin{from{transform:rotate(-24deg)}to{transform:rotate(-6deg)}}
@keyframes mgA-out{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-40px)}}
</style>
