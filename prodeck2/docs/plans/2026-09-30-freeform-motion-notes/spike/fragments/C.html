<style>
.lc{position:absolute;left:0;top:0;width:1080px;height:900px;overflow:hidden}
.lc-in{position:absolute;left:0;top:0;width:1080px;height:900px;animation:lc-life 4.2s linear both}
.lc svg{position:absolute;left:0;top:0;width:1080px;height:900px;display:block}
.lc-n{position:absolute;left:100px;top:260px;width:340px;height:340px;display:flex;align-items:center;justify-content:center;font-size:240px;line-height:1;color:#FFFFFF;animation:lc-num .96s linear both}
.lc-go{position:absolute;left:60px;top:335px;width:420px;height:190px;box-sizing:border-box;padding-top:10px;display:flex;align-items:center;justify-content:center;border:10px solid #1F2227;border-radius:64px;background:#FFD447;color:#1F2227;font-size:104px;line-height:1;white-space:nowrap;box-shadow:0 14px 26px rgba(31,34,39,.35);animation:lc-pop .22s cubic-bezier(.34,1.56,.64,1) 2.78s both}
.lc-dial{transform-origin:270px 430px;animation:lc-dialout .16s ease-in 2.78s both}
.lc-lit{animation:lc-lit .12s linear both}
.lc-arm{animation:lc-arm .2s cubic-bezier(.5,0,.8,.3) both}
.lc-j{animation:lc-jolt .3s linear both}
.lc-rum{animation:lc-rumble .76s linear 2.1s both}
.lc-lift{animation:lc-lift .99s linear 2.86s both}
.lc-fl{transform-box:fill-box;transform-origin:50% 0%;animation:lc-flame 1.75s linear 2.1s both}
.lc-pf{transform-box:fill-box;transform-origin:50% 50%;animation:lc-puff .3s cubic-bezier(.34,1.56,.64,1) both}
.lc-sk{transform-box:fill-box;transform-origin:50% 100%;animation:lc-streak .22s ease-out both}
@keyframes lc-life{0%{opacity:0;transform:translateY(50px);animation-timing-function:ease-out}5.2%{opacity:1;transform:translateY(0)}91.7%{opacity:1;transform:translateY(0);animation-timing-function:ease-in}100%{opacity:0;transform:translateY(-40px)}}
@keyframes lc-num{0%{opacity:0;transform:scale(.3);animation-timing-function:cubic-bezier(.34,1.56,.64,1)}23%{opacity:1;transform:scale(1)}84%{opacity:1;transform:scale(1);animation-timing-function:ease-in}97%,100%{opacity:0;transform:scale(.55)}}
@keyframes lc-pop{from{transform:rotate(-16deg) scale(0)}to{transform:rotate(-5deg) scale(1)}}
@keyframes lc-dialout{from{transform:scale(1)}to{transform:scale(0)}}
@keyframes lc-lit{from{opacity:0}to{opacity:1}}
@keyframes lc-arm{from{transform:translateX(0)}to{transform:translateX(-150px)}}
@keyframes lc-jolt{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}50%{transform:translateX(6px)}75%{transform:translateX(-3px)}}
@keyframes lc-rumble{0%,100%{transform:translateX(0)}8%{transform:translateX(-8px)}16%{transform:translateX(7px)}24%,40%,90%{transform:translateX(-4px)}32%,48%{transform:translateX(4px)}56%,72%{transform:translateX(-5px)}64%,80%{transform:translateX(5px)}}
@keyframes lc-lift{0%{transform:translateY(0);animation-timing-function:ease-out}14%{transform:translateY(14px);animation-timing-function:cubic-bezier(.6,0,.9,.5)}100%{transform:translateY(-980px)}}
@keyframes lc-flame{0%{transform:scale(.5,0)}8%{transform:scale(1,.5)}17%{transform:scale(.9,.38)}26%{transform:scale(1,.52)}35%{transform:scale(.9,.4)}44%{transform:scale(1,.5)}51.4%{transform:scale(1.1,1)}62%{transform:scale(1,.9)}74%{transform:scale(1.15,1.35)}87%{transform:scale(1.05,1.25)}100%{transform:scale(1.15,1.5)}}
@keyframes lc-puff{from{transform:translate(var(--dx),24px) scale(0)}to{transform:translate(0px,0px) scale(1)}}
@keyframes lc-streak{from{transform:scaleY(0)}to{transform:scaleY(1)}}
</style>
