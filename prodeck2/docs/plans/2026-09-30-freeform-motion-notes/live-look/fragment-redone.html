<style>

.door{transform-box:fill-box;transform-origin:top center;animation:shut .22s cubic-bezier(.5,0,.8,1) calc(var(--w7) * 1s - .22s) both}
@keyframes shut{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.rk{transform-box:fill-box;transform-origin:bottom center;animation:bump .4s ease-out calc(var(--w7) * 1s) both}
@keyframes bump{0%{transform:translateY(0) scale(1,1)}30%{transform:translateY(-16px) scale(.97,1.04)}60%{transform:translateY(0) scale(1.04,.96)}100%{transform:translateY(0) scale(1,1)}}
